[workspace]
resolver = "2"
members = ["crates/specfold-core", "crates/specfold-cli"]

[workspace.package]
version = "0.2.6"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/modootoday/specfold"
homepage = "https://github.com/modootoday/specfold"
authors = ["modootoday"]
keywords = ["documentation", "adr", "specification", "cli", "agents"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
specfold-core = { path = "crates/specfold-core", version = "0.2.6" }
anyhow = "1"
clap = { version = "4.6", features = ["derive", "string"] }
globset = "0.4"
ignore = "0.4"
rayon = "1.12"
regex = "1.13"
fancy-regex = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml-rust2 = { version = "0.13", default-features = false }
sha2 = "0.11"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
toml = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tempfile = "3"
assert_cmd = "2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
