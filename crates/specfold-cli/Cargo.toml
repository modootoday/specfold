[package]
name = "specfold"
description = "One CLI for a repository's design, planning and maintenance documents, built for people and AI agents."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# Integration tests sit in tests/<group>/ and are listed below; none are discovered.
autotests = false

# `cargo binstall specfold` downloads the release archive instead of compiling. The names
# follow the Package step of .github/workflows/release.yml (tests/contract/packaging.rs checks this).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/specfold-{ target }.tar.gz"
bin-dir = "specfold-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/specfold-{ target }.zip"
pkg-fmt = "zip"

[[bin]]
name = "specfold"
path = "src/main.rs"

[[bin]]
name = "spec"
path = "src/bin/spec.rs"

[[test]]
name = "assets"
path = "tests/io/assets.rs"

