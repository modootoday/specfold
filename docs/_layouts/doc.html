---
layout: default
---
{% include docs-list.html %}{% include twin-url.html page=page %}
<div class="mx-auto max-w-6xl px-4 py-10 grid gap-10 lg:grid-cols-[14rem_1fr_12rem]">
 <nav aria-label="Documentation" class="text-sm"><p class="font-semibold mb-3">Docs</p><ul class="space-y-1">{% for n in docs %}<li><a class="side" href="{{ n.url | relative_url }}" {% if page.url == n.url %}aria-current="page"{% endif %}>{{ n.title }}</a></li>{% endfor %}</ul></nav>
 <article class="prose min-w-0">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
   <nav aria-label="Breadcrumb" class="crumbs text-sm text-muted"><ol class="flex gap-2"><li><a class="link" href="{{ '/' | relative_url }}">Home</a></li><li aria-hidden="true">/</li><li aria-current="page">{{ page.title }}</li></ol></nav>
   {% if twin %}<div class="flex gap-2 text-sm"><a class="btn-ghost border border-line" href="{{ twin.url | relative_url }}" type="text/markdown">View as Markdown</a><button type="button" class="btn-ghost border border-line" data-copy-md="{{ twin.url | relative_url }}" aria-label="Copy this page as Markdown for AI">Copy for AI</button></div>{% endif %}
  </div>
  {{ content }}
 </article>
 <aside aria-label="On this page" class="hidden lg:block text-sm"><p class="font-semibold mb-3">On this page</p><ul id="toc" class="space-y-1"></ul></aside>
</div>
