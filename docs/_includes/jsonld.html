{%- include twin-url.html page=page -%}
<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
{"@type":"WebSite","name":{{ site.title | jsonify }},"url":"{{ '/' | absolute_url }}"},
{"@type":"SoftwareApplication","name":"specfold","applicationCategory":"DeveloperApplication","operatingSystem":"Linux, macOS, Windows","license":"https://spdx.org/licenses/MIT.html","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"codeRepository":"https://github.com/{{ site.repository }}","description":{{ site.description | jsonify }}}
{%- if page.layout == 'doc' %},
{"@type":"TechArticle","headline":{{ page.title | jsonify }},"description":{{ page.description | jsonify }},"url":"{{ page.url | absolute_url }}"{% if twin %},"encoding":{"@type":"MediaObject","encodingFormat":"text/markdown","contentUrl":"{{ twin.url | absolute_url }}"}{% endif %}},
{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"{{ '/' | absolute_url }}"},{"@type":"ListItem","position":2,"name":{{ page.title | jsonify }},"item":"{{ page.url | absolute_url }}"}]}
{%- endif -%}
{%- if page.layout == 'home' %},
{"@type":"FAQPage","mainEntity":[{% for q in site.data.home.faq %}{"@type":"Question","name":{{ q.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ q.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{% endfor %}]}
{%- endif %}
]}
</script>
