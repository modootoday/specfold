<ul class="nav-groups">{% for g in site.data.nav %}<li><p class="nav-group">{{ g.title }}</p><ul class="space-y-1">{% for p in g.pages %}{% assign n = site.pages | where: "path", p | first %}{% if n %}<li><a class="side" href="{{ n.url | relative_url }}" {% if page.url == n.url %}aria-current="page"{% endif %}>{{ n.title }}</a></li>{% endif %}{% endfor %}</ul></li>{% endfor %}</ul>
