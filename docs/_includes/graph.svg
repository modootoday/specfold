<svg viewBox="0 0 560 360" class="graph w-full h-auto" role="img" aria-labelledby="gt gd">
<title id="gt">How specfold links docs to code</title>
<desc id="gd">A design doc and a plan doc are owned by a team and govern source files. The spec check command verifies every link and reports drift.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fill-muted"/></marker></defs>
<g class="edges" fill="none" stroke-width="2" marker-end="url(#ar)">
 <path class="edge" d="M150 90 C220 90 240 150 300 165"/><path class="edge" d="M150 250 C220 250 240 190 300 185"/>
 <path class="edge gov" d="M390 165 C430 120 450 100 470 90"/><path class="edge gov" d="M390 180 L470 180"/><path class="edge gov" d="M390 195 C430 240 450 260 470 270"/>
</g>
<g font-family="ui-sans-serif,system-ui" font-size="14">
 <g class="node"><rect x="30" y="64" width="120" height="52" rx="10" class="n-doc"/><text x="90" y="88" text-anchor="middle" class="t">design.md</text><text x="90" y="105" text-anchor="middle" class="ts">kind: design</text></g>
 <g class="node"><rect x="30" y="224" width="120" height="52" rx="10" class="n-doc"/><text x="90" y="248" text-anchor="middle" class="t">plan.md</text><text x="90" y="265" text-anchor="middle" class="ts">kind: plan</text></g>
 <g class="node"><rect x="300" y="148" width="90" height="56" rx="28" class="n-own"/><text x="345" y="174" text-anchor="middle" class="t">owner</text><text x="345" y="191" text-anchor="middle" class="ts">@core</text></g>
 <g class="node"><rect x="470" y="70" width="80" height="40" rx="8" class="n-code"/><text x="510" y="95" text-anchor="middle" class="t">src/cli</text></g>
 <g class="node"><rect x="470" y="160" width="80" height="40" rx="8" class="n-code"/><text x="510" y="185" text-anchor="middle" class="t">src/core</text></g>
 <g class="node"><rect x="470" y="250" width="80" height="40" rx="8" class="n-code"/><text x="510" y="275" text-anchor="middle" class="t">tests/</text></g>
 <text x="430" y="140" class="ts">governs</text><text x="190" y="140" class="ts">owned by</text>
 <g class="check"><rect x="190" y="310" width="180" height="36" rx="18" class="n-ok"/><text x="280" y="333" text-anchor="middle" class="t-ok">✓ spec check: 0 errors</text></g>
</g></svg>
