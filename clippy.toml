# Limits from AGENTS.md (CLI-18 onward). Cargo.toml [workspace.lints.clippy] turns
# too_many_lines and cognitive_complexity on for every target; these are their thresholds.
too-many-lines-threshold = 120
cognitive-complexity-threshold = 30
too-many-arguments-threshold = 7
allow-panic-in-tests = true
allow-unwrap-in-tests = true
