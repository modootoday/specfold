name: specfold check
description: Install a specfold release (checksum-verified) and run spec check, as annotations, SARIF, GitLab Code Quality or rdjson.
author: modootoday
branding:
  icon: check-square
  color: blue

inputs:
  version:
    description: Release tag to install, for example the latest tag on the releases page (a bare 1.2.3 is read as v1.2.3). Required; there is no moving default.
    required: true
  format:
    description: github (annotations and a step summary), sarif, rdjson or gitlab.
    default: github
  args:
    description: Extra arguments for spec check, for example `--changed origin/main` or `--rule L1`.
    default: ""
  output:
    description: File for the sarif, rdjson or gitlab document. Default spec-check.<format>.json in the working directory.
    default: ""
  working-directory:
    description: Where to run spec check.
    default: "."

outputs:
  report:
    description: Path of the written document (empty for the github format).
    value: ${{ steps.check.outputs.report }}
  exit-code:
    description: Exit code of spec check.
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install specfold
      shell: bash
      env:
        SPECFOLD_TAG: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/.github/action/install.sh" "$SPECFOLD_TAG" "$RUNNER_TEMP/specfold"
    - name: spec check
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SPECFOLD_FORMAT: ${{ inputs.format }}
        SPECFOLD_ARGS: ${{ inputs.args }}
        SPECFOLD_OUTPUT: ${{ inputs.output }}
      run: |
        case "$SPECFOLD_FORMAT" in github|sarif|rdjson|gitlab) ;; *) echo "::error::format must be github, sarif, rdjson or gitlab"; exit 2 ;; esac
        # Word-split args on purpose: they are flags for spec check.
        # shellcheck disable=SC2086
        set -- check --format "$SPECFOLD_FORMAT" $SPECFOLD_ARGS
        code=0
        if [ "$SPECFOLD_FORMAT" = github ]; then
          spec "$@" || code=$?
          echo "report=" >> "$GITHUB_OUTPUT"
        else
          out="${SPECFOLD_OUTPUT:-spec-check.$SPECFOLD_FORMAT.json}"
          spec "$@" > "$out" || code=$?
          echo "report=$out" >> "$GITHUB_OUTPUT"
          echo "wrote $out"
        fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"
